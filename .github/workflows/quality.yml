name: Website quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build, browser QA and container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: https://quantaedge.in
      - name: Desktop and mobile browser tests
        run: npm run test:e2e
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: https://quantaedge.in
      - name: Validate deployment script syntax
        shell: bash
        run: bash -n scripts/quantaedge-site.sh
      - name: Parse Windows deployment script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/quantaedge-site.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate production Compose configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
      - name: Start local deployment with the Windows manager
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/quantaedge-site.ps1 up -BuildLocal -SitePort 13003
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test the homepage through loopback
        run: curl --fail --show-error http://127.0.0.1:13003/ --output /dev/null
      - name: Stop the CI deployment
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/quantaedge-site.ps1 down -SitePort 13003
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantaedge-browser-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
