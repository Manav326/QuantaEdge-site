name: QuantaEdge Site Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version to publish, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: quantaedge-site-release
  cancel-in-progress: false

jobs:
  validate:
    name: Run release quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: https://quantaedge.in
      - name: Desktop, tablet and mobile browser tests
        run: npm run test:e2e
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: https://quantaedge.in
      - name: Validate production Compose configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet

  publish:
    name: Build and publish versioned GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - name: Checkout selected release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Validate release version and image name
        id: release
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            version="$INPUT_RELEASE_TAG"
          else
            version="$GITHUB_REF_NAME"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must look like v1.0.0 (optionally with a prerelease suffix)."
            exit 1
          fi
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/quantaedge-site" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable version and commit tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://quantaedge.in
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.sha_tag }}
            ${{ steps.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=QuantaEdge corporate website
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=quantaedge-site
          cache-to: type=gha,mode=max,scope=quantaedge-site
          provenance: true
          sbom: true

      - name: Publish release summary
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA_TAG: ${{ steps.release.outputs.sha_tag }}
        run: |
          {
            echo "## QuantaEdge site image published"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Immutable version image: \`$IMAGE:$VERSION\`"
            echo "- Commit image: \`$IMAGE:$SHA_TAG\`"
            echo "- Convenience tag: \`$IMAGE:latest\`"
            echo
            echo "The local deployment can use the immutable version tag for releases and rollbacks."
          } >> "$GITHUB_STEP_SUMMARY"
